function optionHTML(vals,sel='',blank=null){return(blank===null?'':op('',blank,sel))+vals.map(([v,l])=>op(v,l,sel)).join('');}
function regPage(){const replace=regMode==='replace',picked=formMemory.id||'',k=key(picked);let fields;
 if(replace){
 fields=formSelect('rid','Key to retag',db.keys.filter(x=>x.rfid).map(x=>[x.id,x.id+' · '+x.name]),picked)+input('oldtag','Current RFID',k?.rfid||'','readonly')+input('newtag','Replacement RFID number','','required maxlength="32" placeholder="Enter the new tag ID"')+'<p class="hint">The key number and existing loan stay with this key. Earlier transactions retain the RFID recorded at the time.</p>';
 }else{
 const which=formMemory.existing||'',un=key(which);
 fields=formSelect('existing','Key record',[['new','Create a new key'],...db.keys.filter(x=>!x.rfid).map(x=>[x.id,x.id+' · '+x.name])],which||'new',null)+'<div class="two">'+input('asset','Key number',un?.id||nextAsset(),un?'readonly':'required maxlength="24"')+input('keyname','Key name',un?.name||'',un?'readonly':'required maxlength="55" placeholder="e.g. Electrical Room"')+'</div>'+input('newtag','RFID number','','required maxlength="32" placeholder="Scan or enter the tag ID"')+formSelect('regcab','Initial placement',cabinetOpts(true).filter(([c])=>free(c).length),formMemory.cab||'','Register without placement')+'<div id="regslots">'+(formMemory.cab?formSelect('regslot','Empty position',slotOpts(formMemory.cab),'',null):'')+'</div>';
 }
 return h('Asset registration','Bind an HF RFID tag to a key asset')+'<section class="formcard"><div class="module-head"><h2>'+ (replace?'Replace an RFID tag':'Register a key tag')+'</h2><div class="tabs">'+ctrl('regNew','New registration',replace?'':'on')+ctrl('regReplace','Tag replacement',replace?'on':'')+'</div></div><form id="registration" class="formbody" autocomplete="off">'+fields+errs+'<div class="formactions"><button class="btn primary" type="submit">'+I('tag')+(replace?'Replace RFID':'Register tag')+'</button></div></form></section>';
}
function render(){nav();$('main').innerHTML=page==='dash'?dashboard():page==='reg'?regPage():listing();if(cfg[page])tableRows();tick=0;}
function setFocus(on){focusMode=on;document.body.classList.toggle('focus',on);}
function kv(rows){return '<dl class="kv">'+rows.map(([l,v])=>'<div><dt>'+esc(l)+'</dt><dd>'+v+'</dd></div>').join('')+'</dl>';}
function shortHistory(events){return events.slice(0,6).map(e=>'<button class="timeline-item" data-action="event" data-id="'+e.id+'">'+pill(e.type,e.type.toLowerCase())+'<b>'+esc(e.asset)+'</b><span>'+esc(stamp(e.t))+'</span></button>').join('')||'<p class="hint">No transactions yet.</p>';}
function openOverlay(title,html,type){if($('overlay').hidden)lastFocus=document.activeElement;overlayType=type;$('dtitle').textContent=title;$('dcontent').innerHTML=html;$('overlay').hidden=false;document.body.style.overflow='hidden';$('dcontent').scrollTop=0;$('close').focus({preventScroll:true});}
function hideOverlay(){if($('overlay').hidden)return;$('overlay').hidden=true;document.body.style.overflow='';overlayType='';activeCab='';editing='';openKeyId='';if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}

 if(k.slot)rows.push(['Current position','Slot '+pad(k.slot)]);if(k.holder)rows.push(['Current holder',esc(emp(k.holder)?.name)+' · '+esc(k.holder)],['Borrowed at',stamp(k.out)],['Time out','<span class="'+(age(k)>3?'danger':'')+'">'+age(k)+' days</span>']);
 let actions=ctrl('editKey','Edit name','btn',id)+ctrl(k.rfid?'retag':'tagKey',k.rfid?'Replace RFID':'Register tag','btn',id);

function accessList(e,locations=false){
 const assigned=db.cabs.filter(c=>e.authorisedCabinets.includes(c.id));
 if(!assigned.length)return '<span class="dim">None</span>';
 return '<span class="accessList">'+assigned.map(c=>'<span class="accessItem" title="'+esc(c.loc)+'">'+esc(c.id)+(locations?' · '+esc(c.loc):'')+'</span>').join('')+'</span>';
}
function accessPicker(e){
 return '<fieldset class="accessPick"><legend>Authorised cabinets</legend><div>'+db.cabs.map(c=>'<label><input type="checkbox" name="authorisedCabinets" value="'+esc(c.id)+'" '+(e?.authorisedCabinets.includes(c.id)?'checked':'')+'><span><b>'+esc(c.id)+'</b> · '+esc(c.loc)+'</span></label>').join('')+'</div><p class="hint">These are demo permissions. STM Security authorises access at the cabinet.</p></fieldset>';

function employeeDetail(id){const e=emp(id);if(!e)return;const loans=borrowed().filter(k=>k.holder===id);openOverlay(e.name,kv([['Employee ID',mono(e.id)],['Department',esc(e.dept)],['Authorised cabinets',accessList(e,true)],['Currently holding',loans.length+' keys']])+ctrl('editEmp','Edit employee','btn',id)+'<h3>Borrowed keys</h3>'+(loans.length?loans.map(k=>'<button class="timeline-item" data-action="key" data-id="'+esc(k.id)+'"><b>'+esc(k.name)+'</b><span class="mono">'+esc(k.id)+' · '+age(k)+'d</span></button>').join(''):'<p class="hint">No keys on loan.</p>')+'<h3>Recent transactions</h3>'+shortHistory(db.events.filter(x=>x.emp===id)),'employee');}

function editKey(id=''){const k=key(id);formDlg('keyForm',k?'Edit key name':'Add key record',input('asset','Key number',k?.id||nextAsset(),k?'readonly':'required maxlength="24"')+input('keyname','Key name',k?.name||'','required maxlength="55"')+(k?'':'<p class="hint">The key record will be available for RFID pairing in Asset registration.</p>'),'Save key');editing=id;}
function place(id){const k=key(id);if(!k||k.state!=='Registered')return;const options=cabinetOpts(true).filter(([a])=>free(a).length);if(!options.length){toast('No free position in an online cabinet.');return;}const c=options[0][0];formDlg('placeForm','Place '+k.name,formSelect('placecab','Cabinet',options,c,null)+formSelect('placeslot','Empty position',slotOpts(c),'',null),'Place key');editing=id;}
function simDialog(type='Borrow'){modalMode=type;const isB=type==='Borrow';const cs=cabinetOpts(true).filter(([id])=>isB?held(id).length:free(id).length&&borrowed().some(k=>k.cab===id));const start=cs[0]?.[0]||'';
 const tags='<div class="tabs">'+ctrl('simBorrow','Borrow',isB?'on':'')+ctrl('simReturn','Return',isB?'':'on')+'</div>';
 if(!start){openOverlay('Simulate transaction',tags+'<div class="callout">No eligible '+(isB?'key':'loan')+' in an online cabinet.</div>','simulate');return;}
 const fields=formSelect('scab','Cabinet',cs,start,null)+formSelect('skey','Key',[],undefined,null)+formSelect('semp',isB?'Borrowing employee':'Returning employee',db.emps.map(e=>[e.id,e.name+' · '+e.id]),db.emps[0].id,null)+(isB?'':'<div id="slotsim"></div>');
 openOverlay('Simulate transaction',tags+'<p class="drawerlead">Add a sample event to see inventory, loans and recent activity update together.</p><form id="simform" class="formbody">'+fields+errs+'<div class="formactions">'+ctrl('close','Cancel','btn')+'<button type="submit" class="btn primary">'+(isB?'Simulate borrow':'Simulate return')+'</button></div></form>','simulate');simKeys();
}
function simKeys(){let id=$('scab').value;const isB=modalMode==='Borrow';const ks=(isB?held(id):borrowed().filter(k=>k.cab===id));$('skey').innerHTML=optionHTML(ks.map(k=>[k.id,k.name+' · '+k.id]));if(!isB){$('slotsim').innerHTML=formSelect('sslot','Any empty return slot',slotOpts(id),'',null);const k=key($('skey').value);if(k)$('semp').value=k.holder;}}
function err(form,msg){const box=form.querySelector('[data-form-error]');box.hidden=false;box.textContent=msg;return false;}
function closeSave(m){hideOverlay();render();saved(m);}
function freshId(id){return id&&/^[A-Za-z0-9][A-Za-z0-9._-]{0,23}$/.test(id);}
function normalTag(s){return s.toUpperCase().replace(/[\s:-]/g,'');}
function canTag(s){return /^[0-9A-F]{8,32}$/.test(s)&&s.length%2===0;}
function recordEvent(type,k,employee,c,slot){
 const t=db.now+minute;const e={id:'TX-'+pad(Math.max(0,...db.events.map(x=>Number(x.id.slice(3))||0))+1,5),type,t,asset:k.id,name:k.name,rfid:k.rfid,emp:employee.id,person:employee.name,cab:c.id,loc:c.loc,slot};
 if(type==='Borrow')Object.assign(k,{state:'On loan',slot:null,holder:employee.id,out:t});
 else Object.assign(k,{state:'On hand',slot,holder:'',out:0});
 db.now=t;db.events.unshift(e);
}
function submit(f){const fd=new FormData(f);const get=s=>String(fd.get(s)||'').trim();
 if(f.id==='simform'){const c=cab(get('scab')),k=key(get('skey')),e=emp(get('semp')),isB=modalMode==='Borrow';if(!c?.online||!k||!e||k.cab!==c.id||k.state!==(isB?'On hand':'On loan'))return err(f,'This transaction is no longer available.');const slot=isB?k.slot:Number(get('sslot'));if(!isB&&!free(c.id).includes(slot))return err(f,'Choose an available position in this cabinet.');recordEvent(modalMode,k,e,c,slot);closeSave((isB?'Borrow':'Return')+' recorded for '+k.id+' at '+c.id+'.');}
 else if(f.id==='empForm'){const id=get('eid').toUpperCase(),name=get('ename'),dept=get('dept');if(!freshId(id)||!name||!dept)return err(f,'Enter a valid employee ID, name and department.');const e=emp(id);if(!editing&&e)return err(f,'This employee ID already exists.');if(editing&&(!e||id!==editing))return err(f,'Employee record has changed.');const selected=new Set(fd.getAll('authorisedCabinets'));const authorisedCabinets=db.cabs.filter(c=>selected.has(c.id)).map(c=>c.id);if(e)Object.assign(e,{name,dept,authorisedCabinets});else db.emps.push({id,name,dept,authorisedCabinets});closeSave('Employee record saved.');}
 else if(f.id==='keyForm'){const id=get('asset').toUpperCase(),name=get('keyname');if(!freshId(id)||!name)return err(f,'Enter a valid key number and key name.');let k=key(id);if(!editing&&k)return err(f,'This key number already exists.');if(editing&&(!k||editing!==id))return err(f,'Key record has changed.');if(k)k.name=name;else db.keys.push({id,name,rfid:'',state:'Untagged',cab:'',slot:null,holder:'',out:0});closeSave('Key master record saved.');}
 else if(f.id==='placeForm'){const k=key(editing),c=cab(get('placecab')),s=Number(get('placeslot'));if(!k||k.state!=='Registered'||!c?.online||!free(c.id).includes(s))return err(f,'Select a free position in an online cabinet.');Object.assign(k,{cab:c.id,slot:s,state:'On hand'});closeSave(k.id+' placed in '+c.id+', slot '+pad(s)+'.');}
 else if(f.id==='registration'){const tag=normalTag(get('newtag'));if(!canTag(tag))return err(f,'Enter 8–32 hexadecimal characters in complete byte pairs.');if(db.keys.some(k=>k.rfid===tag))return err(f,'This RFID number is already assigned to a key.');
 if(regMode==='replace'){const k=key(get('rid'));if(!k||!k.rfid)return err(f,'Choose a tagged key.');k.rfid=tag;saved('RFID replaced for '+k.id+'.');goto('keys',{q:k.id});}
 else {const existing=get('existing'),id=get('asset').toUpperCase(),name=get('keyname');let k=existing==='new'?null:key(existing);if(!freshId(id)||!name)return err(f,'Enter a valid key number and key name.');if(existing!=='new'&&(!k||k.rfid||k.id!==id))return err(f,'Select an untagged key.');if(!k&&key(id))return err(f,'This key number already exists.');const cabId=get('regcab'),sl=Number(get('regslot'));if(cabId&&(!cab(cabId)?.online||!free(cabId).includes(sl)))return err(f,'Choose an empty cabinet position.');if(!k){k={id,name,holder:'',out:0};db.keys.push(k);}Object.assign(k,{rfid:tag,state:cabId?'On hand':'Registered',cab:cabId,slot:cabId?sl:null});saved('RFID registered to '+k.id+'.');goto('keys',{q:id});}}
}
function setReg(mode,id=''){goto('reg');regMode=mode;formMemory=mode==='replace'?{id}:{existing:id};render();}
function handler(a,id){switch(a){
 case 'nav':goto(id);break;case 'menu':{const on=document.body.classList.toggle('menu');document.querySelector('.menubg').hidden=!on;break;}
 case 'focus':if(page!=='dash')goto('dash');setFocus(!focusMode);render();break;
 case 'onlineCabs':goto('cabs',{status:'Online'});break;case 'stock':case 'loans':case 'cabs':case 'hist':case 'reg':goto(a);break;
 case 'typeHist':goto('hist',{type:id});break;case 'cabHist':goto('hist',{cab:id});break;case 'keyHist':goto('hist',{q:id});break;case 'cabStock':goto('stock',{cab:id});break;
 case 'toggleScroll':scrollOn=!scrollOn;{const b=document.querySelector('[data-action=toggleScroll]');b.innerHTML=I(scrollOn?'pause':'play')+(scrollOn?'Pause scrolling':'Resume scrolling');}tick=0;break;
 case 'clear':filter={};pageNo=1;render();break;case 'prev':pageNo--;tableRows();break;case 'next':pageNo++;tableRows();break;case 'close':hideOverlay();break;
 case 'cab':cabinetDetail(id);break;case 'key':keyDetail(id);break;case 'event':eventDetail(id);break;case 'emp':employeeDetail(id);break;
 case 'addEmp':editEmp();break;case 'editEmp':editEmp(id);break;case 'addKey':editKey();break;case 'editKey':editKey(id);break;case 'place':place(id);break;
 case 'retag':setReg('replace',id);break;case 'tagKey':setReg('new',id);break;case 'regNew':setReg('new');break;case 'regReplace':setReg('replace');break;
 case 'simulate':case 'simBorrow':simDialog('Borrow');break;case 'simReturn':simDialog('Return');break;
 case 'reset':openOverlay('Reset demo data','<p class="drawerlead">Restore the original sample cabinets, employees, keys and transactions in this browser.</p><div class="formactions">'+ctrl('close','Cancel','btn')+ctrl('resetConfirmed','Reset sample data','btn primary')+'</div>','reset');break;
 case 'resetConfirmed':db=seed();saved('Sample data restored.');goto('dash');break;
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){if(el.disabled)return;if(el.tagName==='BUTTON')e.preventDefault();handler(el.dataset.action,el.dataset.id||'');}else if(e.target===$('overlay'))hideOverlay();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('overlay').hidden)hideOverlay();else if(focusMode){setFocus(false);render();}else if(document.body.classList.contains('menu'))handler('menu');return;}if(e.key==='Tab'&&!$('overlay').hidden){const items=[...$('overlay').querySelectorAll('button:not(:disabled),select:not(:disabled),input:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items[items.length-1]?.focus();}else if(!e.shiftKey&&document.activeElement===items[items.length-1]){e.preventDefault();items[0]?.focus();}}if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='TR'&&e.target.dataset.action){e.preventDefault();handler(e.target.dataset.action,e.target.dataset.id);}});
document.addEventListener('input',e=>{
 const field=e.target.id==='q'?'q':e.target.dataset.stockField;
 if(field){filter[field]=e.target.value;pageNo=1;tableRows();}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){const fld=el.dataset.filter;filter[fld]=el.value;pageNo=1;tableRows();return;}
 if(el.id==='rid'){$('oldtag').value=key(el.value)?.rfid||'';formMemory.id=el.value;}
 if(el.id==='existing'){const k=key(el.value);$('asset').value=k?.id||nextAsset();$('keyname').value=k?.name||'';$('asset').readOnly=$('keyname').readOnly=!!k;formMemory.existing=el.value;}
 if(el.id==='regcab'){$('regslots').innerHTML=el.value?formSelect('regslot','Empty position',slotOpts(el.value),'',null):'';formMemory.cab=el.value;}
 if(el.id==='placecab')$('placeslot').innerHTML=optionHTML(slotOpts(el.value));
 if(el.id==='scab')simKeys();if(el.id==='skey'&&modalMode==='Return')$('semp').value=key(el.value)?.holder||db.emps[0].id;});
document.addEventListener('submit',e=>{e.preventDefault();submit(e.target);});
document.addEventListener('pointerover',e=>{if(e.target.closest('.feedscroll'))hoverFeed=true;});
document.addEventListener('pointerout',e=>{if(e.target.closest('.feedscroll')&&!e.relatedTarget?.closest?.('.feedscroll')){hoverFeed=false;tick=0;}});
setInterval(()=>{if(page!=='dash'||!scrollOn||hoverFeed||!$('overlay').hidden||document.hidden||document.activeElement?.closest('.feedscroll')||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;if(++tick<12)return;tick=0;document.querySelectorAll('.feedscroll').forEach(el=>{const row=el.querySelector('.event');if(!row||el.scrollHeight<=el.clientHeight)return;const next=el.scrollTop+row.getBoundingClientRect().height;el.scrollTo({top:el.scrollTop+el.clientHeight>=el.scrollHeight-2?0:Math.min(next,el.scrollHeight-el.clientHeight),behavior:'smooth'});});},1000);
$('hamb').innerHTML=I('menu');$('focusIcon').innerHTML=I('focus');$('close').innerHTML=I('close');render();
</script></body></html>
